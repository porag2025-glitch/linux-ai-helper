[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "linux-ai-helper"
version = "0.1.0"
description = "AI-powered Linux terminal helper with GUI and CLI support"
requires-python = ">=3.8"
dependencies = [
    "google-genai",
    "requests",
    "Pillow"
]

[project.scripts]
ai-helper = "app:main"
